<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>SamNPlayer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <nav id="rail">
      <div class="brand" title="SamNPlayer"><img src="/src/assets/images/logo-universal.png" alt="SamNPlayer" /></div>
      <button class="tab-btn active" data-tab="playback" title="Wiedergabe">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
        <span>Play</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="training" title="Training">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 8.5v4l2.8 1.6"/></svg>
        <span>Training</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="generator" title="Skript erzeugen">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h9M5 17h14"/><path d="M16 10.5l3 1.5-3 1.5"/></svg>
        <span>Erzeugen</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="benchmark" title="Golden-Clip-Benchmark">
        <svg viewBox="0 0 24 24"><path d="M12 3.2l2.1 5.9h6.2l-5 3.7 1.9 6.1L12 15.7 6.8 18.9l1.9-6.1-5-3.7h6.2z"/></svg>
        <span>Bench</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="roi-training" title="KI-Trainingssystem">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span>KI-Train.</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="device" title="Gerät">
        <svg viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="4"/><path d="M12 16.5h.01"/></svg>
        <span>Gerät</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="log" title="Protokoll">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
        <span>Log</span><i class="dot"></i>
      </button>
      <button class="tab-btn" data-tab="settings" title="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.4 6.4l1.6 1.6M16 16l1.6 1.6M17.6 6.4 16 8M8 16l-1.6 1.6"/></svg>
        <span>Einstell.</span><i class="dot"></i>
      </button>
    </nav>

    <div class="app-main">
      <header id="topbar">
        <h1 class="topbar-brand">
          <span class="mark">SamN</span><span class="rest">Player</span>
        </h1>
        <div class="pills">
          <div id="topbar-device-wrap" class="topbar-device-wrap">
            <button type="button" id="topbar-device" class="topbar-device is-offline" title="Gerätetab öffnen" aria-live="polite">
              <svg class="topbar-device-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="4" width="10" height="16" rx="3"/>
                <path d="M12 17h.01"/>
              </svg>
              <span id="topbar-device-name">Nicht verbunden</span>
              <i id="topbar-device-led" class="topbar-device-led"></i>
            </button>
            <button type="button" id="topbar-device-action" class="topbar-device-action">Verbinden</button>
          </div>
          <span id="version-label" class="pill"></span>
        </div>
      </header>

      <div class="stage">
        <div class="stage-main">
          <section id="tab-playback" class="tab-panel active"></section>
          <section id="tab-training" class="tab-panel"></section>
          <section id="tab-generator" class="tab-panel"></section>
          <section id="tab-benchmark" class="tab-panel"></section>
          <section id="tab-roi-training" class="tab-panel"></section>
          <section id="tab-device" class="tab-panel"></section>
          <section id="tab-log" class="tab-panel"></section>
          <section id="tab-settings" class="tab-panel"></section>
        </div>
        <aside id="sidebar"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
