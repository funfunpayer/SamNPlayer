name: Native CI

on:
  push:
    branches: [main, claude/keen-davinci-t2ysrs]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install pybind11

      - name: Build native
        run: |
          cd native
          mkdir -p build && cd build
          cmake .. -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
          cmake --build . --parallel

      - name: Run parity tests
        run: |
          export PYTHONPATH=$PWD/native/build
          python3 native/tests/test_beatbar_parity.py
          python3 native/tests/test_stroke_filter_parity.py
          python3 native/tests/test_funscript_parity.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pybind11
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11

      - name: Build native
        shell: bash
        run: |
          cd native
          mkdir -p build && cd build
          cmake .. -Dpybind11_DIR=$(python -m pybind11 --cmakedir) -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release --parallel

      - name: Run parity tests
        shell: bash
        run: |
          export PYTHONPATH=$PWD/native/build/Release
          python native/tests/test_beatbar_parity.py
          python native/tests/test_stroke_filter_parity.py
          python native/tests/test_funscript_parity.py
