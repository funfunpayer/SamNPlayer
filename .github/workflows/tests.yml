name: Tests

# Läuft bei JEDEM Push und jedem Pull Request - nicht erst beim Release.
#
# Das ist der Unterschied, der Teamarbeit erst möglich macht: bisher liefen
# die Tests nur bei einem Versions-Tag. Ein Fehler wäre also erst beim
# Ausliefern aufgefallen, und dann in fremdem Code, dessen Zusammenhang man
# längst vergessen hat.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: scripts/ci/apt-install.sh ffmpeg
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt wanted changes:" && gofmt -d . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race ./...
      - name: Tests, suite edition
        run: go test -race -tags suite ./...
      - name: Build without OpenCV (CGO on)
        run: CGO_ENABLED=1 go build -o /tmp/samn ./cmd/gui-wails

  go-opencv:
    name: Go (OpenCV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenCV + ffmpeg
        run: scripts/ci/apt-install.sh libopencv-dev ffmpeg
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: go vet (-tags opencv)
        run: go vet -tags opencv ./...
      - name: Tests with race detector (-tags opencv)
        run: go test -race -tags opencv ./...

  python:
    name: Python (Generator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r generator/requirements.txt
      - name: Fast tests
        working-directory: generator
        run: python -m pytest -q --ignore=tests/test_video.py
      - name: Video-based tests
        working-directory: generator
        run: python -m pytest -q tests/test_video.py
      - name: Benchmark clip prep
        working-directory: generator
        run: python -c "from tests.bench_prep import main; main()"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test

  native:
    name: Native (C++ / pybind11, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: scripts/ci/apt-install.sh build-essential cmake python3-dev
      - name: Install pybind11
        run: pip install pybind11
      - name: Build native module
        working-directory: native
        run: |
          mkdir -p build
          cd build
          cmake .. -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
          make -j$(nproc)
      - name: Parity tests
        run: |
          PYTHONPATH=native/build python3 native/tests/test_beatbar_parity.py
          PYTHONPATH=native/build python3 native/tests/test_stroke_filter_parity.py
          PYTHONPATH=native/build python3 native/tests/test_beat_strokes_parity.py
          PYTHONPATH=native/build python3 native/tests/test_funscript_parity.py

  native-windows:
    name: Native (C++ / pybind11, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pybind11
        run: pip install pybind11
      - name: Build native module
        working-directory: native
        shell: pwsh
        run: |
          mkdir build
          cd build
          $pybindDir = python -m pybind11 --cmakedir
          cmake .. -Dpybind11_DIR="$pybindDir" -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release
      - name: Parity tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "native/build/Release"
          python native/tests/test_beatbar_parity.py
          python native/tests/test_stroke_filter_parity.py
          python native/tests/test_beat_strokes_parity.py
          python native/tests/test_funscript_parity.py
