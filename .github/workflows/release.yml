name: Release

# Läuft bei jedem Tag, der wie "v1.2.3" aussieht (git tag v1.2.3 && git push --tags).
# Baut die GUI (Wails) für Windows und Linux, hängt beide Binaries an einen
# GitHub-Release mit demselben Namen wie der Tag. Die App selbst
# (update/update.go) prüft genau gegen diese Releases.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Quellversion und Release-Tag prüfen
        env:
          SAMNPLAYER_RELEASE_TAG: ${{ github.ref_name }}
        run: go test ./update -run TestSourceVersion -count=1

      - name: Systemabhängigkeiten (WebKitGTK für Linux-Build + mingw fürs Windows-Cross-Build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Versionsnummer aus dem Tag lesen
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Linux-Binary bauen (GUI)
        working-directory: cmd/gui-wails
        run: |
          wails build -trimpath -tags webkit2_41 \
            -ldflags "-X github.com/funfunpayer/SamNPlayer/update.Version=${{ steps.version.outputs.version }}"
          mv build/bin/SamNPlayer ../../SamNPlayer-gui-linux-amd64

      - name: Linux-Binary bauen (CLI)
        run: |
          go build -trimpath -ldflags "-X github.com/funfunpayer/SamNPlayer/update.Version=${{ steps.version.outputs.version }}" \
            -o SamNPlayer-cli-linux-amd64 ./cmd/cli

      - name: Windows-Binary cross-kompilieren (GUI)
        working-directory: cmd/gui-wails
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          wails build -platform windows/amd64 -trimpath \
            -ldflags "-X github.com/funfunpayer/SamNPlayer/update.Version=${{ steps.version.outputs.version }}"
          mv build/bin/SamNPlayer.exe ../../SamNPlayer-gui-windows-amd64.exe

      - name: Windows-Binary cross-kompilieren (CLI)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-X github.com/funfunpayer/SamNPlayer/update.Version=${{ steps.version.outputs.version }}" \
            -o SamNPlayer-cli-windows-amd64.exe ./cmd/cli

      - name: Tests laufen lassen (nur Nicht-GUI-Pakete)
        run: go test ./funscript/... ./device/... ./player/... ./update/... ./generator/...

      - name: Prüfsummen erzeugen
        run: |
          sha256sum \
            SamNPlayer-gui-linux-amd64 \
            SamNPlayer-cli-linux-amd64 \
            SamNPlayer-gui-windows-amd64.exe \
            SamNPlayer-cli-windows-amd64.exe \
            > checksums.txt
          cat checksums.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SamNPlayer-gui-linux-amd64
            SamNPlayer-cli-linux-amd64
            SamNPlayer-gui-windows-amd64.exe
            SamNPlayer-cli-windows-amd64.exe
            checksums.txt
          generate_release_notes: true
